services:
  - type: web
    name: number-info-bot
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn main:app
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: UPI_ID
        sync: false
      - key: UPI_NAME
        sync: false
      - key: ADMIN_IDS
        sync: false
      - key: FREE_USES
        value: 2
      - key: PRICE_PER_SEARCH
        value: 5
      - key: PORT
        value: 10000
    plan: free
